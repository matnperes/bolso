<style>
  :root { --bg:#F2F2F0; --card:#FFFFFF; --ink:#1B1B1D; --muted:#6D6D6A; --line:#E5E5E1; --accent:#7A2B39; --bad:#A1412F; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111113; --card:#1C1C1F; --ink:#EDEDEA; --muted:#9B9B97; --line:#2E2E33; --accent:#B85C6B; --bad:#E58C7A; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; }
  h1 { margin: 0 0 6px; font: italic 400 2.6rem/1 "Iowan Old Style", Georgia, serif; color: var(--accent); }
  p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }
  form { display: grid; gap: 10px; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 14px 16px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; }
  button[disabled] { opacity: 0.6; }
  #err { margin: 10px 0 0; min-height: 1.4em; color: var(--bad); font-size: 0.9rem; }
  .hint { margin-top: 22px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; font-size: 0.85rem; color: var(--muted); }
  .hint b { color: var(--ink); }
  [hidden] { display: none !important; }
</style>

<script>
(function () {
  "use strict";
  var KEY_LS = "nyc26-key", READY_LS = "nyc26-offline-ok";
  var SALT = "lHyzy5E3sUMUKDuZUmbRvQ==", IV = "r7wynzh8FMOBS+Mp", ITER = 600000;
  var $ = function (id) { return document.getElementById(id); };
  var payload = $("payload").textContent.replace(/\s+/g, "");

  function fromB64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
  function norm(p) { return String(p).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---- funcionamento offline: service worker + aviso de "pronto"
  function registerSW() {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; }).then(function () {
      return caches.match(new URL("index.html", location.href).href);
    }).then(function (hit) { if (hit) announceReady(); }).catch(function () {});
  }
  function announceReady() {
    if (ls(READY_LS)) return;
    var tries = 0;
    (function wait() {
      if (typeof window.toast === "function" && document.querySelector("nav.tabs")) { ls(READY_LS, "1"); window.toast("Pronto para usar sem internet ✓"); return; }
      if (++tries < 120) setTimeout(wait, 1000);
    })();
  }

  // ---- abrir o app
  async function deriveKey(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pass)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decrypt(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(IV) }, key, fromB64(payload));
    return new TextDecoder().decode(plain);
  }
  // Só troca a página depois que ela terminou de carregar: trocar durante o carregamento
  // faz o navegador recalcular a largura da tela errado.
  function loaded() { return document.readyState === "complete" ? Promise.resolve() : new Promise(function (r) { window.addEventListener("load", function () { setTimeout(r, 0); }, { once: true }); }); }
  async function show(html) { await loaded(); document.open(); document.write(html); document.close(); }
  function lockScreen(msg) {
    $("lock").hidden = false;
    if (window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) $("hint").hidden = true;
    if (msg) $("err").textContent = msg;
  }

  async function start() {
    if (!(window.crypto && crypto.subtle)) { lockScreen("Abra este endereço pelo Safari, com https://, para destravar o app."); $("go").disabled = true; return; }
    var saved = ls(KEY_LS);
    if (saved) {
      var html = null;
      try { var key = await crypto.subtle.importKey("raw", fromB64(saved), "AES-GCM", false, ["decrypt"]); html = await decrypt(key); }
      catch (e) { ls(KEY_LS, null); }
      if (html) { await show(html); return; }
    }
    lockScreen("");
    $("f").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var pw = $("pw").value;
      if (!norm(pw)) { $("err").textContent = "Digite a senha."; return; }
      $("go").disabled = true; $("go").textContent = "Abrindo…"; $("err").textContent = "";
      var html = null;
      try {
        var key = await deriveKey(pw);
        html = await decrypt(key);
        ls(KEY_LS, toB64(await crypto.subtle.exportKey("raw", key)));
      } catch (e) { html = null; }
      if (html) { await show(html); return; }
      $("go").disabled = false; $("go").textContent = "Abrir";
      $("err").textContent = "Senha incorreta. Confira e tente de novo.";
    });
    setTimeout(function () { try { $("pw").focus(); } catch (e) {} }, 300);
  }

  registerSW();
  start();
})();
